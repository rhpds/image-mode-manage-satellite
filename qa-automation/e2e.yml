---
# E2E — End-to-end test
# Runs the qa-automation/scripts shell scripts against the satellite VM, in a
# fixed order. Fails on the first broken script.
#
# The showroom runner container has direct SSH access to the VMs in its own
# namespace (reachable by their Service name via cluster DNS) and is given
# ANSIBLE_USER/ANSIBLE_PASSWORD for auth — it does not receive BASTION_HOST
# (that's only injected into the setup init container).

- name: Build inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add bastion host
      ansible.builtin.add_host:
        name: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
        ansible_ssh_host: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
        ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') }}"
        ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
        ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"

- name: E2E - run scripts in order
  hosts: all:!localhost
  gather_facts: false
  become: true
  vars:
    scripts_path: "{{ playbook_dir }}/scripts"
    scripts_in_order:
      - module-02-solve
      - module-02-validation
      - module-03-solve
      - module-03-validation
      - module-04-solve
      - module-04-validation
      - module-05-solve
      - module-05-validation
      - module-06-solve
      - module-06-validation
      - module-07-solve
      - module-07-validation
      - module-08-solve
      - module-08-validation
      - module-09-solve
      - module-09-validation
  tasks:
    - name: "Run each script in order"
      ansible.builtin.include_tasks: tasks/run_script.yml
      loop: "{{ scripts_in_order }}"
      loop_control:
        loop_var: script_name
